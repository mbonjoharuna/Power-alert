{% extends "base.html" %}
{% block title %}{{ t('nav_report') }} — {{ t('app_name') }}{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card form-card-wide">
        <h1>⚠️ {{ t('report_title') }}</h1>
        <p class="muted">{{ t('report_subtitle') | safe }}</p>

        <form method="POST" action="{{ url_for('report') }}" id="reportForm" novalidate style="margin-top: 24px;">
            <div class="form-group">
                <label for="neighborhood">📍 {{ t('label_neighborhood') }}</label>
                <input type="text" id="neighborhood" name="neighborhood" required
                       value="{{ session.get('user_neighborhood', '') }}"
                       list="neighborhoods" maxlength="100"
                       placeholder="{{ t('placeholder_neighborhood') }}">
                <datalist id="neighborhoods">
                    <option value="Bonamoussadi">
                    <option value="Deido">
                    <option value="Akwa">
                    <option value="Bonanjo">
                    <option value="Bali">
                    <option value="New Bell">
                    <option value="Bassa">
                    <option value="Logbaba">
                    <option value="Makepe">
                    <option value="Kotto">
                    <option value="Ndokoti">
                    <option value="Yassa">
                    <option value="Bonapriso">
                    <option value="Bonaberi">
                    <option value="PK 8">
                    <option value="PK 10">
                    <option value="PK 12">
                    <option value="PK 14">
                    <option value="PK 17">
                </datalist>
            </div>
            <div class="form-group">
                <label for="location">📌 {{ t('label_location') }}</label>
                <input type="text" id="location" name="location" required
                       maxlength="200" placeholder="{{ t('placeholder_location') }}">
            </div>
            <div class="form-group">
                <label for="description">📝 {{ t('label_description') }}</label>
                <textarea id="description" name="description" rows="3"
                          placeholder="{{ t('placeholder_description') }}"></textarea>
            </div>
            <div class="form-group">
                <label for="start_time">🕒 {{ t('label_start_time') }}</label>
                <input type="datetime-local" id="start_time" name="start_time" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">🚀 {{ t('btn_submit_report') }}</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Default start time to now (local)
    document.addEventListener('DOMContentLoaded', function () {
        var input = document.getElementById('start_time');
        if (input && !input.value) {
            var now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            input.value = now.toISOString().slice(0, 16);
        }
    });
</script>
{% endblock %}
